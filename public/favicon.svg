<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 274 115" role="img" aria-label="Luscar Climatização">
  <!--
    Favicon-shaped mark, not the full logo.

    The brief is explicit that the alpinist favicon must not be presented as
    the complete brand, and that the logo must not sit inside an artificial
    square frame. So this is an original geometric mark: a rounded blue field
    carrying a white snowflake/airflow glyph, which reads at 16px and says
    "climatization" without pretending to be the company's logo artwork.
  -->
  <rect width="274" height="115" rx="14" fill="#092A45" />
  <g transform="translate(57.5 57.5)" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round">
    <path d="M0-34V34M-29.5-17L29.5 17M29.5-17L-29.5 17" />
    <path d="M0-34l-8-8M0-34l8-8M-29.5-17l-1-11M-29.5-17l10-4M29.5-17l1-11M29.5-17l-10-4" />
  </g>
  <text
    x="104"
    y="56"
    font-family="Arial Narrow, Arial, sans-serif"
    font-size="25"
    font-weight="700"
    fill="#FFFFFF"
    letter-spacing="0.5"
  >LUSCAR</text>
  <text
    x="104"
    y="76"
    font-family="Arial, sans-serif"
    font-size="12.5"
    font-weight="600"
    fill="#20AFE3"
    letter-spacing="1.6"
  >CLIMATIZACAO</text>
</svg>